<title id="title">Bilhão da Virada 2026</title>
<desc id="desc">Trevo verde com quatro folhas, palavras brancas em negrito itálico no estilo Manrope e ano verde. Todos os caracteres são contornos vetoriais independentes de fontes do sistema.</desc>
